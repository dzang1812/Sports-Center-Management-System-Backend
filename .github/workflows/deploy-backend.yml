name: Deploy backend to EC2

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build happens here (GitHub's runner), not on the tiny EC2 box — it only has 1GB RAM
      # and a near-full 6.6GB disk, not enough to build 25k lines of C# reliably.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish SportsCenter.API -c Release -o publish

      - name: Copy build output to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "publish/*"
          target: "/var/www/sportscenter-api"
          strip_components: 1

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart sportscenter-api
            sudo systemctl --no-pager status sportscenter-api
