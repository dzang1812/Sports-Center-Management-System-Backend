# One origin for both apps: the React build (FE repo's deploy workflow copies it to /var/www/sportscenter-web)
# at "/", the API (Kestrel on localhost:5000) at "/api/" — so no CORS, one TLS certificate.
# Install: sudo cp sportscenter-app.conf /etc/nginx/snippets/ and this file to /etc/nginx/sites-available/,
# symlink it into sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
# Certificate (needs the domain's A records pointing here):
#   sudo certbot certonly --nginx -d sportscenter.id.vn -d www.sportscenter.id.vn --deploy-hook "systemctl reload nginx"

# Domain visitors on plain HTTP are sent to HTTPS.
server {
    listen 80;
    server_name sportscenter.id.vn www.sportscenter.id.vn;
    return 301 https://$host$request_uri;
}

# Bare-IP HTTP keeps working (direct access, PayOS webhook if registered by IP).
# default_server: without it, nginx picks whichever site file loads first as the fallback.
server {
    listen 80 default_server;
    server_name _;
    include snippets/sportscenter-app.conf;
}

server {
    listen 443 ssl;
    server_name sportscenter.id.vn www.sportscenter.id.vn;

    ssl_certificate /etc/letsencrypt/live/sportscenter.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportscenter.id.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/sportscenter-app.conf;
}
