# Reverse proxy: public :80/:443 -> Kestrel on localhost:5000.
# Install: sudo cp this file to /etc/nginx/sites-available/sportscenter-api,
# symlink into sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
# Add HTTPS afterwards with: sudo certbot --nginx -d your-domain.com (needs a real domain pointed at the EC2 IP).
server {
    # default_server: without it, nginx picks whichever site file loads first (alphabetically) as
    # the fallback for requests that don't match any server_name — e.g. a request to the bare IP.
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
    }
}
