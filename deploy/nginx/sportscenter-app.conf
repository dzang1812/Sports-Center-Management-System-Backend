# Shared by the HTTP (bare IP) and HTTPS (domain) server blocks in sportscenter-api.conf.
# Install: sudo cp this file to /etc/nginx/snippets/sportscenter-app.conf
root /var/www/sportscenter-web;
index index.html;

location /api/ {
    proxy_pass http://localhost:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection keep-alive;
    # nginx's 1MB default is too small for image/video uploads.
    client_max_body_size 20m;
}

# SPA: any path that is not a real file falls back to index.html for React Router.
location / {
    try_files $uri $uri/ /index.html;
}
